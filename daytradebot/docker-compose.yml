# Day Trade Bot — app do umbrelOS (ADR-013 do repositorio do bot).
#
# 15 containers: postgres + gateway + scheduler + runner + web + 11 instancias.
#
# REDE: network_mode host, igual ao que rodava no host antes da migracao.
# Postgres em 127.0.0.1:5433 e Gateway em 127.0.0.1:4002. Foi mantido assim de
# proposito: o jts.ini do Gateway tem TrustedIPs=127.0.0.1, entao mudar para a
# umbrel_main_network exigiria reconfigurar o Gateway e revalidar as 11 conexoes
# de API — uma segunda mudanca de risco empilhada na migracao. Fica para depois.
# (Validado na fase 0: os dois modos de rede convivem no mesmo app, entao a
# migracao para bridge pode ser feita servico a servico.)
#
# SEGREDOS: nenhum aqui. A senha do Postgres e derivada do ${APP_SEED} do
# umbrelOS, e as credenciais da IBKR sao lidas em runtime de
# ${APP_DATA_DIR}/secrets/ibkr.env, que so existe no dispositivo do usuario.

version: "3.7"

x-instance: &instance
  image: ghcr.io/drumblow/trader-bot:latest
  # on-failure, nao unless-stopped: a instancia sai com 0 quando esta fora da
  # janela de pregao, e nesse caso precisa FICAR parada ate o scheduler liga-la.
  # Um bot que quebra de verdade sai != 0 e reinicia.
  restart: on-failure
  network_mode: host
  # Folga para o encerramento gracioso. O padrao do docker e 10s, e o laco do
  # live so acorda a cada 30s — em 04/09/2026 nove das onze instancias foram
  # mortas antes de registrar `live_stopped`. O binario passou a acordar na
  # hora do sinal; isto aqui e o cinto de seguranca do outro lado.
  stop_grace_period: 45s
  volumes:
    # Segredos do dispositivo (so leitura). O entrypoint carrega o webhook de
    # alertas de alerts.env, se preenchido — nada disso entra em imagem/repo.
    - ${APP_DATA_DIR}/secrets:/run/trader-secrets:ro
  depends_on:
    - postgres
    - gateway

x-instance-env: &instance-env
  DATABASE_URL: postgres://trader:${APP_SEED}@127.0.0.1:5433/trader_db
  TRADER__IBKR__HOST: 127.0.0.1
  TRADER__IBKR__PORT: 4002

services:
  postgres:
    image: postgres:15-alpine
    restart: on-failure
    network_mode: host
    environment:
      POSTGRES_USER: trader
      POSTGRES_PASSWORD: ${APP_SEED}
      POSTGRES_DB: trader_db
    command: >-
      postgres
      -p 5433
      -c listen_addresses=127.0.0.1
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c work_mem=8MB
      -c maintenance_work_mem=64MB
      -c max_connections=100
    volumes:
      - ${APP_DATA_DIR}/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trader -d trader_db -p 5433"]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    image: ghcr.io/drumblow/trader-gateway:latest
    restart: always
    network_mode: host
    volumes:
      # Instalacao do IB Gateway fornecida pelo usuario — a imagem publica nao
      # redistribui binario da Interactive Brokers.
      - ${APP_DATA_DIR}/gateway/ibgateway:/opt/trader/ibgateway:ro
      - ${APP_DATA_DIR}/gateway/gateway-settings:/opt/trader/gateway-settings
      # jts.ini na raiz do TWS_PATH: e daqui que o Gateway le as preferencias
      # ja respondidas (SSL, proxy). Sem ele o Gateway abre o dialogo "Use SSL
      # encryption" dentro do Xvfb, onde ninguem pode clicar, e a API nunca sobe.
      # Descoberto no cutover de 2026-08-28.
      - ${APP_DATA_DIR}/gateway/jts.ini:/opt/trader/jts.ini
      - ${APP_DATA_DIR}/logs/ibc:/opt/trader/logs/ibc
      # Credenciais IBKR, so leitura. O entrypoint carrega e falha com mensagem
      # clara se estiverem faltando.
      - ${APP_DATA_DIR}/secrets:/run/trader-secrets:ro
    environment:
      TRADING_MODE: paper
    mem_limit: 1g
    # O Chromium do JxBrowser precisa de /dev/shm maior que os 64MB padrao
    shm_size: 256m

  scheduler:
    image: ghcr.io/drumblow/trader-scheduler:latest
    restart: on-failure
    volumes:
      # Liga e desliga as instancias irmas. E o mesmo nivel de acesso que os
      # timers systemd tinham com sudo no host.
      - /var/run/docker.sock:/var/run/docker.sock
      - ${APP_DATA_DIR}/backups:/backups
      # Webhook de alertas (so leitura). O scheduler detectava backup falhado e
      # "subiram 7 de 11 no open" e so escrevia no proprio log — A9 da auditoria.
      - ${APP_DATA_DIR}/secrets:/run/trader-secrets:ro
    environment:
      POSTGRES_CONTAINER: daytradebot_postgres_1
      # ADR-016: as tres instancias da pullback-trend-v1 sairam. Com custo de
      # execucao realista (2 bp) a estrategia fica NEGATIVA nos tres ativos —
      # e o edge dela tem a mesma ordem de grandeza do spread.
      INSTANCES: >-
        daytradebot_ijs-balance_1
        daytradebot_vbr-balance_1 daytradebot_avuv-balance_1
        daytradebot_iwm-openrev_1 daytradebot_iwn-openrev_1
        daytradebot_avuv-rangefade_1 daytradebot_slyv-rangefade_1
        daytradebot_iwv-rangefade_1
    depends_on:
      - postgres

  runner:
    # Runner self-hosted do GitHub Actions. Antes era um servico systemd em /etc,
    # apagado a cada boot pelo rugix — o CI ficava mudo ate alguem reinstalar.
    #
    # E tambem o unico acesso administrativo ao host que sobrevive a um reboot,
    # ja que o usuario trader e o sudoers dele nao sobrevivem.
    image: ghcr.io/drumblow/trader-runner:latest
    restart: on-failure
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${APP_DATA_DIR}/runner:/home/runner/config
      # So leitura: o deploy precisa do compose, nao precisa altera-lo.
      - ${APP_DATA_DIR}:/appdata:ro
    environment:
      # Caminhos do HOST — o docker do runner fala com o daemon do host, entao
      # os binds do compose precisam resolver na perspectiva dele.
      APP_DATA_DIR: ${APP_DATA_DIR}
      APP_SEED: ${APP_SEED}

  # Painel de status (ADR-014 do repositorio do bot). Read-only: le o Postgres
  # com default_transaction_read_only=on e nao fala com o broker. E a UI que o
  # umbrelOS abre ao clicar no app (port 8551 no manifesto). Roda 24/7 como o
  # postgres — fora do pregao o painel continua util (historico, eventos).
  web:
    image: ghcr.io/drumblow/trader-web:latest
    restart: on-failure
    network_mode: host
    environment:
      DATABASE_URL: postgres://trader:${APP_SEED}@127.0.0.1:5433/trader_db
      TRADER_WEB_BIND: 0.0.0.0:8551
      TRADER_WEB_GATEWAY_ADDR: 127.0.0.1:4002
    depends_on:
      - postgres

  # ── 11 instancias ────────────────────────────────────────────────────────────
  # client_id 1-11 para market data; o codigo deriva +100 para broker e +200 para
  # o poll de execucao. O client_id 99 e reservado para diagnostico manual e
  # NUNCA deve ser usado por uma instancia.

  iwm-pullback:
    <<: *instance
    # DESLIGADA pelo ADR-016. O profile mantem o servico declarado (o
    # historico no banco continua fazendo sentido) mas fora de qualquer
    # `docker compose up` — inclusive o que o umbreld faz no boot.
    profiles: [desativado]
    environment:
      <<: *instance-env
      SYMBOL: IWM
      STRATEGY: pullback-trend-v1
      TRADER__IBKR__CLIENT_ID: 1

  iwv-pullback:
    <<: *instance
    # DESLIGADA pelo ADR-016. O profile mantem o servico declarado (o
    # historico no banco continua fazendo sentido) mas fora de qualquer
    # `docker compose up` — inclusive o que o umbreld faz no boot.
    profiles: [desativado]
    environment:
      <<: *instance-env
      SYMBOL: IWV
      STRATEGY: pullback-trend-v1
      TRADER__IBKR__CLIENT_ID: 2

  iwo-pullback:
    <<: *instance
    # DESLIGADA pelo ADR-016. O profile mantem o servico declarado (o
    # historico no banco continua fazendo sentido) mas fora de qualquer
    # `docker compose up` — inclusive o que o umbreld faz no boot.
    profiles: [desativado]
    environment:
      <<: *instance-env
      SYMBOL: IWO
      STRATEGY: pullback-trend-v1
      TRADER__IBKR__CLIENT_ID: 3

  ijs-balance:
    <<: *instance
    environment:
      <<: *instance-env
      SYMBOL: IJS
      STRATEGY: balance-area-breakout-v1
      TRADER__IBKR__CLIENT_ID: 4

  vbr-balance:
    <<: *instance
    environment:
      <<: *instance-env
      SYMBOL: VBR
      STRATEGY: balance-area-breakout-v1
      TRADER__IBKR__CLIENT_ID: 5

  avuv-balance:
    <<: *instance
    environment:
      <<: *instance-env
      SYMBOL: AVUV
      STRATEGY: balance-area-breakout-v1
      TRADER__IBKR__CLIENT_ID: 6

  iwm-openrev:
    <<: *instance
    environment:
      <<: *instance-env
      SYMBOL: IWM
      STRATEGY: opening-reversal-v1
      TRADER__IBKR__CLIENT_ID: 7

  iwn-openrev:
    <<: *instance
    environment:
      <<: *instance-env
      SYMBOL: IWN
      STRATEGY: opening-reversal-v1
      TRADER__IBKR__CLIENT_ID: 8

  avuv-rangefade:
    <<: *instance
    environment:
      <<: *instance-env
      SYMBOL: AVUV
      STRATEGY: range-extreme-fade-v1
      TRADER__IBKR__CLIENT_ID: 9

  slyv-rangefade:
    <<: *instance
    environment:
      <<: *instance-env
      SYMBOL: SLYV
      STRATEGY: range-extreme-fade-v1
      TRADER__IBKR__CLIENT_ID: 10

  iwv-rangefade:
    <<: *instance
    environment:
      <<: *instance-env
      SYMBOL: IWV
      STRATEGY: range-extreme-fade-v1
      TRADER__IBKR__CLIENT_ID: 11
